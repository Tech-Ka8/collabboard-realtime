name: CollabBoard CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./client
      - name: Install backend dependencies
        run: npm ci
        working-directory: ./server
      - name: Run frontend lint
        run: npm run lint
        working-directory: ./client
      - name: Build frontend
        run: npm run build
        working-directory: ./client
      - name: Check backend JavaScript syntax
        run: find . -type f -name "*.js" -not -path "./node_modules/*" -exec node --check {} \;
        working-directory: ./server